<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wardrobe</title>
<meta name="theme-color" content="#FBFBFA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wardrobe">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/favicon-64.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/Didot-Regular.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="fonts/Jost-var.woff" as="font" type="font/woff" crossorigin>
<style>
@font-face{font-family:"W Didot";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/Didot-Regular.woff) format("woff")}
@font-face{font-family:"W Jost";font-style:normal;font-weight:300 600;font-display:swap;src:url(fonts/Jost-var.woff) format("woff")}
@font-face{font-family:"W Jost";font-style:italic;font-weight:300 600;font-display:swap;src:url(fonts/Jost-Italic-var.woff) format("woff")}
/* Quiet signals: clothes on white paper like a fashion spread, sand reserved for notes and sheets, charcoal ink. Pink appears only when the app is telling you something. */
:root{
  --paper:#FBFBFA; --panel:#ECE8E1; --ink:#2A2826; --ink-2:#5A564F; --rule:#2A2826; --rule-soft:#D3CCC1;
  --pink:#B3005E; --on-pink:#FFFFFF;
  --wine:#5A1A2B; /* the weekday name on a day. Not a signal: pink keeps that job. */
  --didot:"W Didot","Didot","Bodoni 72","Bodoni MT",serif;
  --jost:"W Jost","Futura","Avenir Next","Helvetica Neue",Arial,sans-serif;
  --gutter:max(18px, env(safe-area-inset-left, 0px));
  --gutter-r:max(18px, env(safe-area-inset-right, 0px));
  --tabs-h:calc(62px + env(safe-area-inset-bottom, 0px));
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:300 15px/1.5 var(--jost);caret-color:var(--pink);-webkit-tap-highlight-color:transparent}
::selection{background:var(--pink);color:var(--on-pink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
::placeholder{color:#68635B;opacity:1}
/* hit area: small text controls keep their editorial size and get a 44px touch target from a centred, invisible pseudo-element */
.linkish,.vm-fb button,.swatches .sw,.tile .side{position:relative}
.linkish::after,.vm-fb button::after,.swatches .sw::after,.tile .side::after,.hero .piece::after{content:'';position:absolute;left:50%;top:50%;width:max(calc(100% + 16px),44px);height:max(100%,44px);transform:translate(-50%,-50%)}
.vm-fb button::after,.swatches .sw::after,.tile .side::after,.hero .piece::after{width:max(100%,44px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%;display:block}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-bottom:calc(var(--tabs-h) + 1px + 24px);padding-top:env(safe-area-inset-top,0px);position:relative}
@media (min-width:600px){.app{border-left:1px solid var(--rule-soft);border-right:1px solid var(--rule-soft)}}

/* ---------- type ---------- */
.label{font:500 11px/1.2 var(--jost);letter-spacing:.22em;text-transform:uppercase}
.caption{font-size:12.5px;line-height:1.45;color:var(--ink-2)}
.d{font-family:var(--didot);font-weight:400}
.cap{font:400 11.5px/1.3 var(--didot);letter-spacing:.2em;text-transform:uppercase}
h1.page{font:400 44px/1 var(--didot);letter-spacing:.06em;text-transform:uppercase;margin:0;text-wrap:balance}
h2.sec{font:400 15px/1.2 var(--didot);letter-spacing:.2em;text-transform:uppercase;margin:0;text-wrap:balance}

/* ---------- masthead ---------- */
.mast{display:flex;justify-content:space-between;align-items:center;padding:14px var(--gutter-r) 0 var(--gutter)}
.mast .back{display:inline-flex;align-items:center;gap:4px;min-height:44px;margin:-8px 0 -8px -6px;padding:0 12px 0 0;color:var(--ink);text-decoration:none}
.mast .back svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.mast .word{font:400 12px/1 var(--didot);letter-spacing:.42em;text-transform:uppercase}
.mast button{background:none;border:0;padding:0 0 0 12px;min-height:44px;margin:-8px 0 -8px;display:flex;gap:6px;align-items:center}
.mast button .label{border-bottom:1px solid var(--ink);padding-bottom:2px}
.sample-note{margin:10px var(--gutter-r) 0 var(--gutter);padding:8px 0;border-top:1px solid var(--rule-soft);border-bottom:1px solid var(--rule-soft);display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px;color:var(--ink-2)}
.sample-note a{color:var(--ink);text-underline-offset:3px;white-space:nowrap;display:inline-flex;align-items:center;min-height:44px;margin:-12px 0}
.connline{margin:0;font-size:15px;color:var(--ink)}

/* ---------- today hero ---------- */
.hero{position:relative;height:calc(clamp(340px,95vw,410px) + 98px);overflow:hidden;margin-top:2px}
.hero .stage{position:absolute;left:0;right:0;top:24px;height:clamp(340px,95vw,410px)}
.hero .day{position:absolute;left:.1em;top:-2px;font:400 clamp(92px,31vw,128px)/.86 var(--didot);letter-spacing:-.04em;white-space:nowrap;color:var(--wine)}
.hero .date{position:absolute;left:var(--gutter);top:clamp(82px,27.5vw,114px);font:400 13px/1 var(--didot);letter-spacing:.3em;text-transform:uppercase}
.hero .temp{position:absolute;right:var(--gutter-r);top:12px;text-align:left;width:29%;background:var(--paper);border-left:1px solid var(--rule);padding-left:12px}
.hero .temp .deg{font:400 46px/1 var(--didot);letter-spacing:-.02em}
.hero .temp .fc{display:block;margin-top:6px;font:400 11px/1.35 var(--didot);letter-spacing:.16em;text-transform:uppercase}
.hero .piece{position:absolute;background:none;border:0;padding:0;display:block;transform-origin:50% 60%}
.hero .piece svg,.hero .piece img{width:100%;height:auto;display:block}
.hero .piece img{object-fit:contain}
.hero .piece:focus-visible{outline-offset:6px}
.hero .piece .no{position:absolute;left:-2px;top:-14px;font:400 11px/1 var(--didot);letter-spacing:.1em}
.hero .piece.fresh .no{color:var(--pink)}
.hero .piece.slot-shoes .no{left:-22px;top:28%}
.hero .piece.slot-bottom .no{left:auto;right:2px;top:auto;bottom:-16px}
.hero .piece.slot-outer .no{left:auto;right:6%;top:-2px}

/* the one authored moment: the spread settles into place */
@media (prefers-reduced-motion:no-preference){
  .hero.settle .day{animation:dayIn 900ms var(--ease) both}
  .hero.settle .piece{animation:pieceIn 820ms var(--ease) both}
  .hero.settle .piece:nth-of-type(2){animation-delay:60ms}
  .hero.settle .piece:nth-of-type(3){animation-delay:120ms}
  .hero.settle .piece:nth-of-type(4){animation-delay:180ms}
  .hero.settle .piece:nth-of-type(5){animation-delay:240ms}
  .hero.settle .piece:nth-of-type(6){animation-delay:300ms}
}
@keyframes dayIn{from{transform:translateX(-6%)}to{transform:none}}
@keyframes pieceIn{from{transform:translateY(14px) rotate(-1.5deg)}to{transform:none}}

/* ---------- credits ---------- */
.credits{padding:4px var(--gutter-r) 0 var(--gutter);display:grid;gap:10px}
.occ{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{font:500 11px/1 var(--jost);letter-spacing:.22em;text-transform:uppercase;padding:5px 7px;border:1px solid var(--ink);background:none}
.tag.customer{background:var(--pink);border-color:var(--pink);color:var(--on-pink)}
.tag.off{border-color:var(--rule-soft);color:var(--ink-2)}
button.tag{cursor:pointer}
.occ .tag{position:relative}
.occ .tag::after{content:'';position:absolute;inset:-12px -8px}
.occopts{display:grid;gap:8px;padding:16px var(--gutter-r) 6px var(--gutter)}
.occopts button{display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:10px 12px;border:1px solid var(--ink-2);background:transparent;color:var(--ink);text-align:left;letter-spacing:.1em}
.occopts button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.occopts .now{font-size:11px;letter-spacing:.18em;opacity:.85}
.occnote{padding-top:12px;padding-bottom:22px}
.why{margin:0;font:400 19px/1.25 var(--didot);text-wrap:pretty}
.credit-line{margin:0;display:grid;grid-template-columns:1fr;gap:2px;font:300 12.5px/1.45 var(--jost);color:var(--ink-2)}
.credit-line span{min-width:0}
.credit-line b{font:400 11px/1 var(--didot);letter-spacing:.08em;color:var(--ink);margin-right:2px}
.credit-line button{background:none;border:0;padding:0;font:400 14px/1 var(--didot);color:var(--ink);cursor:pointer;text-decoration:underline;text-decoration-color:var(--rule-soft);text-underline-offset:3px}
.credit-list{margin:0;font-size:13px;line-height:1.55}
.credit-list button{background:none;border:0;padding:0;font:400 15px/1.3 var(--didot);text-decoration:underline;text-decoration-color:var(--rule-soft);text-underline-offset:3px}
.credit-list button:hover{text-decoration-color:var(--ink)}
.credit-list .fresh{color:var(--pink)}
.adjusted{margin:0;font-size:12.5px;color:var(--pink);font-weight:400}


/* ---------- the look: numbered notes, fabric story, palette ---------- */
.panel{background:var(--panel);margin-top:26px;padding-block:22px 26px;border-top:1px solid var(--rule)}
.panel + .panel{margin-top:0;border-top:1px solid var(--rule-soft)}
.panel > .cap{display:block;padding:0 var(--gutter-r) 12px var(--gutter)}
.notes{list-style:none;margin:0;padding:0 var(--gutter-r) 0 var(--gutter);display:grid;gap:0}
.notes li{display:grid;grid-template-columns:28px 56px 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--rule-soft)}
.notes li:first-child{border-top:0}
.notes .n{font:400 13px/1 var(--didot);letter-spacing:.06em}
.notes .fresh .n{color:var(--pink)}
.notes .fl{height:56px;display:grid;place-items:center}
.notes .fl svg,.notes .fl img{max-height:56px;width:auto;max-width:56px}
.notes button{background:none;border:0;padding:0;text-align:left;display:grid;gap:3px;min-width:0;min-height:44px;align-content:center}
.notes .t{font:400 12.5px/1.2 var(--didot);letter-spacing:.16em;text-transform:uppercase}
.notes .s{font-size:12.5px;line-height:1.35;color:var(--ink-2)}
.notes .fresh .s{color:var(--pink)}
.fabrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:18px 14px;padding:0 var(--gutter-r) 0 var(--gutter)}
.fabric{display:grid;gap:7px;align-content:start}
.fabric .sw{aspect-ratio:4/3;width:100%;background-size:cover;background-position:center}
.fabric .t{font:400 11px/1.25 var(--didot);letter-spacing:.18em;text-transform:uppercase}
.fabric .s{font-size:12px;line-height:1.35;color:var(--ink-2)}
.palette{list-style:none;margin:0;padding:0 var(--gutter-r) 0 var(--gutter);display:grid;gap:8px}
.palette li{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;padding:10px 0;border-top:1px solid var(--rule-soft)}
.palette li:first-child{border-top:0;padding-top:0}
.palette i{height:44px;display:block;background-size:cover;background-position:center}
.palette .t{display:block;font:400 11.5px/1.3 var(--didot);letter-spacing:.2em;text-transform:uppercase}
.palette .s{display:block;margin-top:4px;font-size:12.5px;line-height:1.4;color:var(--ink-2)}
.quote{margin:0;padding:0 var(--gutter-r) 0 var(--gutter);font:400 19px/1.3 var(--didot);max-width:28ch}

/* ---------- buttons ---------- */
.acts{display:flex;gap:8px;padding:16px var(--gutter-r) 0 var(--gutter);flex-wrap:wrap}
.btn{font:500 11px/1 var(--jost);letter-spacing:.2em;text-transform:uppercase;padding:15.5px 16px;min-height:44px;text-align:center;border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:0;transition:background .2s,color .2s}
.btn:hover{opacity:.86}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--paper)}
.btn[disabled]{background:transparent;color:var(--ink-2);border-color:var(--rule-soft);cursor:default}
.linkish{background:none;border:0;padding:0;color:var(--ink);cursor:pointer;font:500 11px/1 var(--jost);letter-spacing:.22em;text-transform:uppercase;text-decoration:underline;text-underline-offset:4px}

/* ---------- week strip ---------- */
.strip{display:grid;grid-template-columns:repeat(7,1fr);margin:22px var(--gutter-r) 0 var(--gutter);border-top:1px solid var(--rule);padding-top:10px;text-align:center}
.strip a{color:inherit;text-decoration:none;display:grid;gap:3px;justify-items:center;padding:2px 0 4px}
.strip .label{font-size:11px;letter-spacing:.1em}
.strip b{font:400 19px/1 var(--didot);font-variant-numeric:tabular-nums}
.strip .on b{color:var(--pink)}
.strip .on .label{border-bottom:1px solid var(--ink);padding-bottom:2px}
.strip i{width:5px;height:5px;border-radius:50%;background:var(--pink)}
.strip i.no{background:transparent}

/* ---------- section pages ---------- */
.pagehead{padding:18px var(--gutter-r) 0 var(--gutter);display:grid;gap:8px}
.lede{margin:0;font:400 20px/1.25 var(--didot);max-width:30ch;text-wrap:pretty}
.lede em{font-style:normal;color:var(--pink)}
.rule{border:0;border-top:1px solid var(--rule);margin:18px var(--gutter-r) 0 var(--gutter)}

/* week list */
.days{list-style:none;margin:0;padding:0 var(--gutter-r) 0 var(--gutter)}
.days li{border-bottom:1px solid var(--rule-soft)}
.days a{display:grid;grid-template-columns:72px 1fr;gap:4px 12px;padding:14px 0;color:inherit;text-decoration:none}
.days .dn{font:400 40px/.9 var(--didot);letter-spacing:-.03em}
.days .today .dn{color:var(--pink)}
.days .meta{display:grid;gap:6px;align-content:start;min-width:0}
.days .meta .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.days .meta .t{font:400 20px/1 var(--didot);font-variant-numeric:tabular-nums}
.thumbs{display:flex;gap:8px;align-items:flex-end;height:46px;overflow:hidden;min-width:0}
.thumbs span{display:flex;align-items:flex-end;height:100%;flex:0 1 auto;min-width:0;max-width:19%}
.thumbs svg,.thumbs img{max-height:100%;width:100%;height:auto}
.days .names{font-size:12px;line-height:1.45;color:var(--ink-2)}
.plan-note{margin:14px var(--gutter-r) 0 var(--gutter);padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);font:400 17px/1.3 var(--didot)}
.plan-note .label{display:block;margin-bottom:6px;font-family:var(--jost)}

/* closet */
.filters{display:flex;gap:0;overflow-x:auto;padding:4px var(--gutter-r) 0 calc(var(--gutter) - 8px);scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button,.segs button,.weektabs button{background:none;border:0;padding:0 8px;flex:none;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;color:var(--ink-2);background-origin:content-box;background-repeat:no-repeat;background-size:0 1px;background-position:0 calc(100% + 5px);background-image:linear-gradient(var(--ink),var(--ink))}
.filters button[aria-pressed="true"],.segs button[aria-pressed="true"],.weektabs button[aria-pressed="true"]{color:var(--ink);background-size:100% 1px}
.filters .n{font-family:var(--didot);letter-spacing:0;margin-left:4px;font-size:12px}
.group{padding:0 var(--gutter-r) 0 var(--gutter)}
.group h2{padding:22px 0 10px;border-bottom:1px solid var(--rule)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 14px;padding-top:14px}
.item{background:none;border:0;padding:0;text-align:left;display:grid;grid-template-columns:minmax(0,1fr);gap:6px;align-content:start;min-width:0}
.item .img{aspect-ratio:4/5;display:grid;place-items:end center;padding:8% 10% 4%;border-bottom:1px solid var(--rule-soft)}
.item .img svg,.item .img img{max-height:100%;max-width:100%;width:auto;height:auto}
.item .img img{object-fit:contain;height:100%}
.item .nm{font:400 11.5px/1.3 var(--didot);letter-spacing:.08em;text-transform:uppercase;text-align:center}
.nb{white-space:nowrap}
.item .no{font:400 11px/1 var(--didot);letter-spacing:.08em;text-align:center;margin-top:4px}
.item .st{font-size:11px;line-height:1.3;color:var(--ink-2);text-align:center}
.item .st.fresh{color:var(--pink)}
.item.aside .img{opacity:.55}
.empty{padding:28px 0;font:400 18px/1.3 var(--didot);color:var(--ink-2)}

/* log */
.picklist{list-style:none;margin:0;padding:0 var(--gutter-r) 0 var(--gutter)}
.picklist li{border-bottom:1px solid var(--rule-soft)}
.picklist label{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 0;cursor:pointer}
.picklist .th{height:44px;display:grid;place-items:center}
.picklist .th svg,.picklist .th img{max-height:44px;width:auto}
.picklist .nm{font:400 16px/1.2 var(--didot)}
.picklist .sub{display:block;font-size:11.5px;color:var(--ink-2);font-family:var(--jost)}
/* packing sheet: the category row stays under the header and scrolls on its own */
.sheet .sheethead{position:sticky;top:0;z-index:4;background:var(--panel)}
.sheet .sheethead .bar{position:static}
.sheet .sheethead .filters{padding-top:4px;padding-bottom:0;border-bottom:1px solid var(--rule-soft);overscroll-behavior-x:contain}
.sheet.packonly .packlist li:not(:has(.check:checked)){display:none}
.sheet.packonly .group:not(:has(.check:checked)){display:none}
/* style tab: rules on top, one pane at a time */
.rulescard{margin-top:18px}
.rulescard .learned li:last-child{border-bottom:0}
.stylepanes{position:sticky;top:0;z-index:6;background:var(--paper);border-bottom:1px solid var(--rule-soft);gap:0;padding-bottom:0;padding-top:0}
.stylepanes .label{letter-spacing:.14em;white-space:nowrap}
.stylepanes .n{margin-left:5px;color:var(--ink-2);font-weight:400}
.stylepane .empty{padding:18px var(--gutter-r) 0 var(--gutter)}
.panehead{display:flex;justify-content:space-between;align-items:baseline;padding:14px var(--gutter-r) 0 var(--gutter)}
.panehead .linkish{min-height:44px;display:inline-flex;align-items:center;margin-top:-14px}
.grid.four{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 10px;padding-top:6px}
.grid.four .item .img{display:block}
.sgrid{list-style:none;margin:0;padding:6px var(--gutter-r) 6px var(--gutter);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px}
.sgrid li{display:grid;gap:6px;align-content:start;min-width:0}
.sgrid .ph{display:block;position:relative;width:100%;padding:0;border:0;background:var(--paper);aspect-ratio:3/4;overflow:hidden}
.sgrid .ph img{width:100%;height:100%;object-fit:cover;display:block}
.sgrid .ph.flat{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:6px;background:var(--panel)}
.sgrid .ph.flat span{display:grid;place-items:center;min-height:0}
.sgrid .ph.flat img,.sgrid .ph.flat svg{max-width:100%;max-height:100%}
.sgrid .in-link{display:grid;place-items:center;height:100%;font:400 18px/1 var(--didot);color:var(--ink-2)}
.sgrid .pstrip{display:grid;grid-template-columns:repeat(auto-fill,26px);gap:6px 4px;align-content:start}
.sgrid .pstrip>span{width:26px;height:26px;display:grid;place-items:center;overflow:hidden;min-width:0;min-height:0}
.sgrid .pstrip img,.sgrid .pstrip svg{display:block;width:100%;height:100%;object-fit:contain}
.sgrid li>.sub{margin-top:2px}
.sgrid li>.pstrip+.sub{margin-top:4px}
.sgrid .sub{font:500 11px/1.4 var(--jost);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2)}
.sgrid .note{font-size:13px;line-height:1.4}
.sgrid .linkish{justify-self:start;padding-top:2px}
.sgrid .badge{position:absolute;left:6px;top:6px;background:var(--panel);font:500 11px/1 var(--jost);letter-spacing:.14em;text-transform:uppercase;padding:4px 6px}
.sgrid .deciders{display:flex;gap:6px 14px;flex-wrap:wrap}
.pagehead .toprow{grid-column:2;grid-row:1 / span 2;align-self:start;display:flex;align-items:center;gap:4px;margin-top:-8px}
.pagehead .toprow .toplink{margin-top:0;padding-left:10px;grid-column:auto;grid-row:auto}
.ownbtn{flex:none;display:grid;place-items:center;width:44px;height:44px;background:none;border:0;color:var(--ink)}
/* what else to pack */
.recs{list-style:none;margin:0;padding:0 var(--gutter-r) 0 var(--gutter)}
.recs li{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule-soft)}
.recs .th{height:44px;display:grid;place-items:center}
.recs .th svg,.recs .th img{max-height:44px;width:auto}
.recs .nm{display:block;font:400 16px/1.2 var(--didot)}
.recs .sub{display:block;font-size:12.5px;color:var(--ink-2)}
.recs .leave .nm{font:500 11px/1.2 var(--jost);letter-spacing:.22em;text-transform:uppercase}
.recs .linkish{min-height:44px;display:inline-flex;align-items:center}
.packrecs .caption.pad{padding-inline:var(--gutter) var(--gutter-r);margin:12px 0 0}
/* a suggested bag sits under the look: dashed and quiet until she ticks it */
.bagrow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;margin:14px var(--gutter-r) 0 var(--gutter);padding:8px 12px;border:1px dashed var(--rule-soft);opacity:.62;transition:opacity .2s var(--ease)}
.bagrow.on{opacity:1;border:1px solid var(--rule-soft)}
.bagrow .th{height:40px;display:grid;place-items:center}
.bagrow .th svg,.bagrow .th img{max-height:40px;width:auto}
.bagrow .bg{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:center;cursor:pointer}
.bagrow .nm{display:block;font:500 11px/1.2 var(--jost);letter-spacing:.22em;text-transform:uppercase}
.bagrow .sub{display:block;font-size:12.5px;color:var(--ink-2)}
.check{appearance:none;width:22px;height:22px;border:1px solid var(--ink);margin:0;display:grid;place-items:center;background:var(--paper)}
.check:checked{background:var(--ink)}
.check:checked::after{content:"";width:10px;height:5px;border-left:1.5px solid var(--paper);border-bottom:1.5px solid var(--paper);transform:translateY(-1px) rotate(-45deg)}
.feel{display:flex;gap:0;margin:0 var(--gutter-r) 0 var(--gutter);border:1px solid var(--ink)}
.feel button{flex:1;background:none;border:0;border-right:1px solid var(--ink);padding:12px 4px;min-height:44px;font:400 15px/1.1 var(--didot)}
.feel button:last-child{border-right:0}
.feel button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.field{display:grid;gap:6px;padding:0 var(--gutter-r) 0 var(--gutter)}
.field input,.field textarea,.field select{min-height:44px;width:100%;border:0;border-bottom:1px solid var(--ink);background:transparent;padding:8px 0;font:300 16px/1.4 var(--jost);border-radius:0}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-bottom-color:var(--pink);box-shadow:0 1px 0 var(--pink)} /* focus: the underline turns pink and doubles to 2px, so it reads without colour */
.cd-body input[type=search]:focus{outline:2px solid var(--ink);outline-offset:2px}
.field textarea{resize:none;min-height:44px}
.field .hint{font-size:12px;color:var(--ink-2)}
.stack{display:grid;gap:22px;padding-top:18px}
.instack>.sub,.instack>.note,.instack>#inspomatches{padding-left:var(--gutter);padding-right:var(--gutter-r)}
.instack #inspomatches{display:grid;gap:10px;justify-items:start}
.instack #inspomatches .vstat{padding:0;width:100%;margin:0}
.instack #inspomatches .vm-cap{margin:0}
.instack #inspomatches p{margin:0}
.history{list-style:none;margin:0;padding:0 var(--gutter-r) 0 var(--gutter)}
.history li{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule-soft);align-items:center}
.history .dt{font:400 16px/1.1 var(--didot)}
.history .dt small{display:block;font:500 11px/1.4 var(--jost);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2)}
.history .thumbs{height:38px}
.photo-in{display:flex;align-items:center;gap:12px;position:relative}
.photo-in img{width:56px;height:72px;object-fit:cover}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(18,18,18,.32);opacity:0;pointer-events:none;transition:opacity .3s var(--ease);z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;max-height:88vh;overflow:auto;background:var(--panel);border-top:1px solid var(--ink);transform:translateY(102%);transition:transform .45s var(--ease);z-index:21;padding:0 0 calc(24px + env(safe-area-inset-bottom,0px))}
.sheet:not(.open){visibility:hidden;transition:transform .45s var(--ease),visibility 0s .45s}
.sheet.open{transform:none}
.sheet:focus{outline:none}
.sheet .bar{position:sticky;top:0;background:var(--panel);display:flex;justify-content:space-between;align-items:center;padding:14px var(--gutter-r) 10px var(--gutter);border-bottom:1px solid var(--rule-soft);z-index:1}
.sheet .big{display:grid;grid-template-rows:minmax(0,1fr);place-items:center;overflow:hidden;height:210px;background:var(--paper);margin:0 var(--gutter-r) 0 var(--gutter);padding:24px}
.sheet .big svg,.sheet .big img{max-height:100%;width:auto;max-width:70%}
.sheet .big img{height:100%;object-fit:contain}
.office{padding:0 0 4px}
.officehead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:16px var(--gutter-r) 0 var(--gutter)}
.weektabs{display:flex;gap:0;margin-right:-8px}
.chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:8px var(--gutter-r) 0 var(--gutter)}
.chips button{padding:10px 0;border:1px solid var(--ink-2);background:transparent;min-height:44px;color:var(--ink);text-align:center;letter-spacing:.1em;white-space:nowrap}
.chips button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.officenote{margin:14px 0 0}
.officelooks{margin-top:22px}
.officelooks > .cap{display:block}
.days .olook{display:grid;grid-template-columns:72px 1fr;gap:4px 12px;padding:14px 0 0}
.days .olook .rowact{grid-column:1/-1;padding-left:84px}
.days .rowact{padding:0 0 4px 84px;margin-top:-6px}
.days .rowact .linkish{display:inline-flex;align-items:center;min-height:44px}
body.toasting .netnote{visibility:hidden}
body.sheet-open .toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 14px)}
.extras{padding:22px 0 8px;border-top:1px solid var(--rule-soft);margin-top:18px}
.extras > .cap{display:block;padding:0 var(--gutter-r) 8px var(--gutter)}
.extralist{list-style:none;margin:0;padding:0 var(--gutter-r) 0 var(--gutter)}
.extralist li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid var(--rule-soft)}
.extralist .linkish{min-height:44px;display:inline-flex;align-items:center}
.extras .field{margin-top:14px}
.try-steps{list-style:none;margin:14px var(--gutter-r) 0 var(--gutter);padding:0;display:grid;gap:8px;counter-reset:s}
.try-steps li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);font-size:13.5px;line-height:1.45}
.try-steps li::before{content:"0" counter(s);font:400 14px/1.4 var(--didot)}
.try-img{display:grid;place-items:center;background:#F7F6F3;margin:18px var(--gutter-r) 0 var(--gutter)}
.try-img img{display:block;max-width:100%;max-height:320px;width:auto;height:auto;object-fit:contain}
.try-prompt{margin-top:26px}
.try-prompt textarea{min-height:190px;line-height:1.45}
.ptabs{gap:0;padding-top:6px;border-bottom:1px solid var(--rule-soft)}
.ptabs button{padding:0 11px}
.ppane[hidden]{display:none}
.sheet h2.sec{padding:16px var(--gutter-r) 0 var(--gutter);font-size:22px;letter-spacing:.12em}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;padding:12px var(--gutter-r) 0 var(--gutter);margin:0;font-size:13.5px}
.facts dt{color:var(--ink-2)}
.facts dd{margin:0;min-width:0}
.toggles{display:grid;gap:0;padding:0 var(--gutter-r) 0 var(--gutter)}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule-soft);gap:12px;cursor:pointer}
.toggle span{font:400 16px/1.2 var(--didot)}
.toggle small{display:block;font:300 12px/1.35 var(--jost);color:var(--ink-2)}
.switch{appearance:none;width:42px;height:24px;border:1px solid var(--ink);margin:0;position:relative;background:var(--paper);flex:none;border-radius:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border:1.5px solid var(--ink);background:transparent;transition:transform .25s var(--ease),background .2s}
.switch::before{content:"";position:absolute;left:9px;top:6px;width:9px;height:5px;border-left:1.5px solid var(--paper);border-bottom:1.5px solid var(--paper);transform:rotate(-45deg);opacity:0;transition:opacity .2s}
.switch:checked{background:var(--ink);border-color:var(--ink)}
.switch:checked::before{opacity:1}
.switch:checked::after{transform:translateX(18px);background:var(--paper);border-color:var(--paper)}
.swaps{list-style:none;margin:0;padding:0 var(--gutter-r) 0 var(--gutter)}
.swaps li button{width:100%;display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:center;background:none;border:0;border-bottom:1px solid var(--rule-soft);padding:10px 0;text-align:left}
.swaps .th{height:52px;display:grid;place-items:center}
.swaps .th svg,.swaps .th img{max-height:52px;width:auto}
.swaps .nm{font:400 17px/1.2 var(--didot)}
.swaps .sub{display:block;font-size:12px;color:var(--ink-2)}
.swaps .cur .nm::after{content:" · wearing";font:500 11px/1 var(--jost);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2)}
.segs{display:flex;gap:0;padding:4px var(--gutter-r) 0 calc(var(--gutter) - 8px);overflow-x:auto}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--paper);border-top:1px solid var(--rule);padding:0 var(--gutter-r) env(safe-area-inset-bottom,0px) var(--gutter)}
.tabs .in{max-width:444px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:62px}
.tabs a{color:var(--ink-2);text-decoration:none;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:44px}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.tabs .label{font-size:11px;letter-spacing:.12em;padding-bottom:2px;border-bottom:1px solid transparent}
.tabs a[aria-current="page"]{color:var(--ink)}
.tabs a[aria-current="page"] .label{border-bottom-color:var(--ink)}
.tabs a[aria-current="page"] svg{stroke-width:1.6}
.toast{position:fixed;left:50%;bottom:calc(var(--tabs-h) + 14px);transform:translate(-50%,12px);opacity:0;background:var(--ink);color:var(--paper);padding:11px 16px;font:500 11px/1.2 var(--jost);letter-spacing:.2em;text-transform:uppercase;transition:opacity .3s,transform .4s var(--ease);z-index:30;pointer-events:none;max-width:calc(100% - 36px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;left:0;top:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- on repeat, status, rules ---------- */
.rep{background:none;border:0;padding:0;width:44px;height:44px;display:grid;place-items:center;color:var(--ink-2);flex:none;position:relative}
.rep::before{content:'';position:absolute;inset:4px}
.rep>*{position:relative}
.rep[aria-pressed="true"]{color:var(--paper)}
.rep[aria-pressed="true"]::before{background:var(--ink)}
.tile{position:relative;min-width:0}
.tile .item{width:100%}
.tile .rep{position:absolute;top:-4px;right:-4px}
.notes li{grid-template-columns:28px 56px 1fr auto}
.notes .rep{display:grid;place-items:center;padding:0;gap:0}
.segs.wrap{flex-wrap:wrap;row-gap:0;padding-top:0}
.pad{padding-left:var(--gutter);padding-right:var(--gutter-r)}
p.pad{margin:0 0 12px}
.rule-row{margin:6px 0 0;font-size:13px;line-height:1.4;color:var(--ink-2)}
.rule-row .linkish{margin-left:6px}
.facenote{margin:0}
.triptag{margin:0;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.triptag a{color:var(--ink);text-decoration:none}
.triptag .label{border-bottom:1px solid var(--ink);padding-bottom:2px}
.hero .piece.slot-belt .no{left:auto;right:-16px;top:2px}
.hero .piece.slot-bag .no{left:auto;right:4%;top:-14px}

/* ---------- reactions ---------- */
.reacts{list-style:none;margin:0;padding:0 var(--gutter-r) 0 var(--gutter)}
.reacts li{border-bottom:1px solid var(--rule-soft)}
.reacts button{width:100%;display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;background:none;border:0;padding:10px 0;text-align:left}
.reacts .th{height:44px;display:grid;place-items:center}
.reacts .th svg,.reacts .th img{max-height:44px;width:auto}
.reacts .nm{font:400 16px/1.2 var(--didot)}
.reacts .sub{display:block;font-size:11.5px;color:var(--ink-2)}
.reacts .sub.on{color:var(--ink)}

/* ---------- trips ---------- */
.pagehead.withlink{grid-template-columns:1fr auto;align-items:start}
.pagehead.withlink .cap{grid-column:1}
.pagehead .toplink{grid-column:2;grid-row:1 / span 2;align-self:start;display:inline-flex;align-items:center;min-height:44px;margin-top:-8px;padding:0 0 0 14px;color:var(--ink);text-decoration:none}
.pagehead .toplink .label{border-bottom:1px solid var(--ink);padding-bottom:2px}
.tripstrip{display:grid;gap:4px;margin:14px var(--gutter-r) 0 var(--gutter);padding:12px 0 0;border-top:1px solid var(--rule);color:inherit;text-decoration:none}
.tripstrip .t{font:400 19px/1.2 var(--didot)}
.tripstrip .s{font-size:12.5px;color:var(--ink-2)}
.tripstrip .g{font-size:12.5px;color:var(--pink)}
.days.trips .dn{font-size:40px}
.days.trips .t.d{font:400 20px/1.2 var(--didot)}
.tweather,.packing,.looks,.triplooks{padding-top:22px}
.tweather > .cap,.packing > .cap,.looks > .cap,.triplooks > .cap{display:block;padding:0 var(--gutter-r) 12px var(--gutter)}
.tweather .caption{margin:10px var(--gutter-r) 0 var(--gutter)}
.tstrip{display:grid;grid-template-columns:repeat(7,1fr);row-gap:14px;margin:0 var(--gutter-r) 0 var(--gutter);border-top:1px solid var(--rule);padding-top:10px;text-align:center}
.tstrip a{color:inherit;text-decoration:none;display:grid;gap:3px;justify-items:center}
.tstrip .label{font-size:11px;letter-spacing:.1em}
.tstrip b{font:400 19px/1 var(--didot);font-variant-numeric:tabular-nums}
.tstrip .dd{font-size:11px;color:var(--ink-2)}
.gaps{margin:22px var(--gutter-r) 0 var(--gutter);padding:12px 0 14px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.gaps .label{display:block;margin-bottom:8px;color:var(--pink)}
.gaps ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.gaps li{font:400 17px/1.3 var(--didot)}
.packlist{padding:0}
.packing .group h2.sec{padding-top:18px}
.stop{display:grid;gap:14px;border-top:1px solid var(--rule-soft);padding-top:16px;margin:0 var(--gutter-r) 0 var(--gutter)}
.stop .field{padding:0}
.stophead{display:flex;justify-content:space-between;align-items:baseline}
.inrow{display:flex;gap:14px;align-items:flex-end}
.inrow input{flex:1;min-width:0}
.inrow .linkish{padding-bottom:10px}
.finds{list-style:none;margin:6px 0 0;padding:0}
.finds button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule-soft);padding:10px 0;font:400 16px/1.25 var(--didot)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.field input[type=date]{-webkit-appearance:none;appearance:none;font-family:var(--jost)}
/* style: loves, looks, inspiration */
.tile .love{position:absolute;top:-4px;left:-4px}
.tile .side{position:absolute;top:38px;right:4px;width:30px;height:30px;padding:2px;border:1px solid var(--rule-soft);background:var(--paper);display:grid;place-items:center}
.tile .side img,.tile .side svg{width:100%;height:100%;object-fit:contain}
.otherside{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:1px solid var(--rule-soft);padding:8px;color:var(--ink);font:inherit}
.otherside .th{width:48px;height:48px;flex:none;display:grid;place-items:center}.otherside .th img,.otherside .th svg{width:100%;height:100%;object-fit:contain}
.otherside small{display:block;color:var(--ink-2);font-size:12px}
h2.sec .n{font-size:12px;letter-spacing:0;margin-left:6px;color:var(--ink-2)}
.looks,.inspo,.learned{list-style:none;margin:0;padding:0 var(--gutter-r) 0 var(--gutter)}
.looks li{display:grid;grid-template-columns:56px minmax(0,1fr);gap:4px 14px;padding:14px 0;border-bottom:1px solid var(--rule-soft);align-items:start}
.looks .lk-ph img{width:56px;height:72px;object-fit:cover;display:block}
.looks .lk-ph:empty{display:block;width:56px;height:72px;background:var(--paper)}
.looks .lk-body{display:grid;gap:6px;min-width:0}
.looks .sub,.inspo .sub{font:500 11px/1.4 var(--jost);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2)}
.looks .note,.inspo .note{font-size:13px;line-height:1.4;color:var(--ink)}
.looks .rm{grid-column:2;justify-self:start}
.inspo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px;padding-bottom:6px}
.inspo li{display:grid;gap:6px;align-content:start;min-width:0}
.inspo .in-ph{display:block;background:var(--paper);aspect-ratio:4/5;overflow:hidden}
.inspo .in-ph img{width:100%;height:100%;object-fit:cover;display:block}
.inspo .in-link{display:grid;place-items:center;height:100%;font:400 18px/1 var(--didot);color:var(--ink-2)}
.inspo .linkish{justify-self:start}
.learned li{padding:10px 0;border-bottom:1px solid var(--rule-soft);font:400 17px/1.35 var(--didot)}
.learned li .tag{margin-left:8px;vertical-align:3px;white-space:nowrap}
.thumbs.chosen{height:52px;margin-top:6px}
/* modes, rating, scores */
.modes{padding-top:2px;padding-bottom:0;gap:0;justify-content:space-between;overflow:visible}
.modes button{position:relative;min-height:44px;padding:0 14px 0 0;background-image:none;color:var(--ink-2);white-space:nowrap}
.modes button:last-child{padding-right:0}
.modenote{margin:0;padding:0 var(--gutter-r) 6px var(--gutter)}
.modes button[aria-pressed="true"]{color:var(--ink);font-weight:600;border-bottom:0}
.modes button[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:14px;bottom:9px;height:2px;background:var(--ink)}
.modes button:last-child[aria-pressed="true"]::after{right:0}
@media (max-width:359px){.modes button{letter-spacing:.14em;padding-right:8px}.modes button[aria-pressed="true"]::after{right:8px}}
.acts.main{padding-top:6px;flex-wrap:nowrap}
.acts.main .btn{min-height:44px;flex:1 1 0;text-align:center;display:inline-flex;align-items:center;justify-content:center;padding-top:0;padding-bottom:0}
.acts.main .btn:first-child{flex-grow:1.3}
.rate{display:flex;align-items:center;gap:0 18px;padding:4px var(--gutter-r) 6px var(--gutter);flex-wrap:wrap}
.rate .label:first-child{color:var(--ink-2)}
.rate button{background:none;border:0;padding:0;min-height:44px;color:var(--ink-2);cursor:pointer}
.rate button[aria-pressed="true"]{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:6px}
.scores{list-style:none;margin:0;padding:0 var(--gutter-r) 0 var(--gutter);display:grid;gap:14px}
.scores li{display:grid;gap:6px}
.scores .t{font:400 15px/1.2 var(--didot);display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.scores .t small{font:500 11px/1 var(--jost);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.scores .bar{height:3px;background:var(--rule-soft);position:relative;display:block}
.scores .bar i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.scores .s{font-size:12.5px;line-height:1.45;color:var(--ink-2)}
/* vision */
/* the day's look: flat lay first, then your photo and the ChatGPT render, one swipe each */
.herow{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.herow::-webkit-scrollbar{display:none}
.herow>.hero,.herow>.heropic{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always}
.heropic{position:relative;margin:2px 0 0;height:calc(clamp(340px,95vw,410px) + 98px);background:var(--paper);display:flex;flex-direction:column;align-items:center;padding:34px var(--gutter) 0}
.heropic .label{position:absolute;left:var(--gutter);top:10px}
.heropic .deciders{display:flex;gap:22px;justify-content:center;margin:2px 0 6px}
.tryons .deciders{display:flex;gap:6px 14px;flex-wrap:wrap}
.heropic .rmpic{position:absolute;right:var(--gutter-r);top:8px}
.heropic img{flex:1;min-height:0;max-width:100%;object-fit:contain}
.heropic .caption{margin:6px 0 4px;text-align:center}
.herodots{display:flex;justify-content:center;gap:8px;padding:2px 0 0}
.herodots i{width:6px;height:6px;border-radius:50%;border:1px solid var(--ink);background:transparent}
.herodots i.on{background:var(--ink)}
.try-result{margin-top:22px;border-top:1px solid var(--rule);padding-top:14px}
.try-res{padding:0 var(--gutter)}
.try-res img{display:block;width:auto;max-width:100%;max-height:420px;margin:10px auto 0}

.verdict3 button{background:none;border:0;border-left:1px solid var(--rule);padding:12px 4px;min-height:44px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.verdict3 button:first-child{border-left:0}

.tryons .in-ph img{width:100%;height:100%;object-fit:cover}

.worth{font:500 11px/1.2 var(--jost);letter-spacing:.14em;text-transform:uppercase;color:var(--wine);margin-right:10px}
.more-list{list-style:none;margin:0;padding:0 var(--gutter)}
.more-list li{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule-soft)}
.more-list .th{width:64px;height:64px;display:grid;place-items:center;background:var(--paper);border:0;padding:0;cursor:pointer}
.more-list .th img,.more-list .th svg{max-width:100%;max-height:100%}

.acts-inline{display:flex;flex-wrap:wrap;gap:6px 16px}
.swatches{display:flex;flex-wrap:wrap;gap:10px;padding:4px var(--gutter) 6px}

.swatches .sw[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:3px}
.verdict{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-top:16px;font:300 15px/1.5 var(--jost);color:var(--ink)}
.verdict .big-n{font:400 56px/1 var(--didot);color:var(--wine)}
.with-head{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;padding:14px var(--gutter) 4px}
.with-head .th{width:56px;height:56px;display:grid;place-items:center;background:var(--paper)}
.with-head .th img,.with-head .th svg{max-width:100%;max-height:100%}
.with-head .nm{display:block;font:400 17px/1.25 var(--didot)}
.with-head .sub{display:block;font:300 13px/1.4 var(--jost);color:var(--ink-2)}
.withlooks{list-style:none;margin:0;padding:0 var(--gutter)}
.withlooks .wl{display:grid;gap:8px;padding:16px 0;border-bottom:1px solid var(--rule-soft)}
.withlooks .thumbs{display:flex;flex-wrap:wrap;gap:6px}
.withlooks .th{width:58px;height:58px;display:grid;place-items:center;background:var(--paper);border:0;padding:0;cursor:pointer}
.withlooks .th.hero{outline:1px solid var(--wine);outline-offset:2px}
.withlooks .th img,.withlooks .th svg{max-width:100%;max-height:100%}
.withlooks .names{font:400 15px/1.35 var(--didot);color:var(--ink)}
.withlooks .sub{font:300 13px/1.45 var(--jost);color:var(--ink-2)}
.mini-lay{position:relative;width:100%;aspect-ratio:1/1.04;background:var(--paper);overflow:hidden}

.mini-lay .piece img,.mini-lay .piece svg{width:100%;height:auto;display:block;object-fit:contain}
.sheet .bar .back,#sheet .bar .back{font-size:12px}

.pagehead.compact .lede{font:300 13px/1.4 var(--jost);color:var(--ink-2);max-width:none}
.pagehead.compact .lede{grid-column:1/-1}
.cd-body .segs .n{margin-left:6px;font:400 12px/1 var(--didot);letter-spacing:0;color:var(--ink-2)}

.tripbar{margin-top:18px}
.tripbar .filters{padding-left:calc(var(--gutter) - 8px)}
.tripbar+.group{margin-top:0}
.vstat{display:grid;gap:8px;margin:12px 0 0}
.vstat[hidden]{display:none}
.vbar{display:block;height:2px;background:var(--rule-soft);overflow:hidden}

.verr{color:var(--pink)}

.cfilter b{position:absolute;top:-7px;right:-7px;min-width:16px;height:16px;border-radius:8px;background:var(--wine);color:var(--paper);font:500 11px/16px var(--jost);text-align:center;padding:0 3px}
.cscrim{position:fixed;inset:0;background:rgba(20,18,16,.32);opacity:0;pointer-events:none;transition:opacity .25s var(--ease);z-index:30}
.cscrim.open{opacity:1;pointer-events:auto}
.cdrawer{position:fixed;top:0;bottom:0;right:0;width:min(86vw,360px);background:var(--panel);z-index:31;transform:translateX(100%);transition:transform .26s var(--ease);display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.08)}
.cdrawer:not(.open){visibility:hidden;transition:transform .26s var(--ease),visibility 0s .26s}
.cdrawer.open{transform:none}
.cd-bar{display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) var(--gutter-r) 10px var(--gutter);border-bottom:1px solid var(--rule-soft)}
.cd-body{overflow-y:auto;padding:6px 0 calc(90px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;align-content:start}

.cd-body input[type=search]{margin:0 var(--gutter);width:auto;font:300 15px/1.3 var(--jost);padding:12px;min-height:44px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:0}
.cdots{display:flex;flex-wrap:wrap;gap:4px;padding:2px calc(var(--gutter) - 6px)}

.cdot[aria-pressed="true"] i{outline:2px solid var(--ink);outline-offset:3px}
.cdot[aria-pressed="true"]{color:var(--ink)}
.cres{padding:12px 0 0;margin:0}
.vm{display:flex;gap:10px;flex-wrap:wrap}

.vm-i .th{width:56px;height:56px;display:grid;place-items:center;background:var(--paper)}
.vm-i .th{overflow:hidden}
.vm-i .th svg,.vm-i .th img{width:56px;height:56px;object-fit:contain}
.vm-i small{font:500 11px/1.2 var(--jost);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);text-align:center}
.vm-cap{display:block;padding:0;margin-top:2px}
.vm-w{display:grid;gap:4px;justify-items:center}
.vm-fb{display:flex;gap:4px}
.vm-fb button{width:30px;height:30px;border:1px solid var(--rule);background:none;border-radius:50%;font:500 12px/1 var(--jost);color:var(--ink-2);cursor:pointer}
.vm-fb button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.guess{font-style:normal;text-transform:none;letter-spacing:0;color:var(--ink-2);opacity:.8}
.own{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:10px}
.own img{width:72px;height:92px;object-fit:cover;display:block}
.busy{color:var(--ink)}
/* Long lists. Fold: a section that opens on tap. Reveal: the first few, then "Show N more". See DESIGN.md "Long lists". */
.fold > summary{list-style:none;display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 14px;min-height:44px;padding:0 var(--gutter-r) 0 var(--gutter);cursor:pointer}
.fold > summary::-webkit-details-marker{display:none}
.fold > summary .cap .n{font:400 13px/1 var(--didot);letter-spacing:0;margin-left:8px;color:var(--ink-2)}
.fold > summary .fold-sum{grid-column:1;margin:0}
.fold > summary .fold-act{grid-column:2;grid-row:1 / span 2;font:500 11px/1 var(--jost);letter-spacing:.22em;text-transform:uppercase;text-decoration:underline;text-underline-offset:4px}
.fold > summary .fold-act::after{content:"Show"}
.fold[open] > summary .fold-act::after{content:"Hide"}
.fold[open] > summary{padding-bottom:12px}
.fold > summary:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.panel.fold:not([open]){padding-block:14px}
.fold:not(.panel){margin-top:18px;border-top:1px solid var(--rule-soft)}
.reveal{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px var(--gutter-r) 0 var(--gutter);border-top:1px solid var(--rule-soft)}
.reveal .linkish{min-height:44px;display:inline-flex;align-items:center}
.group .reveal{margin-inline:0}
.history li.mo{display:block;padding:16px 0 6px;border-bottom:1px solid var(--rule)}
.fl-row{padding-top:12px}
.netnote{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100% - 32px);margin:0;padding:6px 12px;background:var(--panel);border:1px solid var(--rule-soft);color:var(--ink);font:400 12px/1.3 var(--jost);text-align:center;z-index:60;pointer-events:none}
